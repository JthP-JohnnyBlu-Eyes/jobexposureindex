name: Daily social post

# Schedules the "job of the day" on X, Bluesky and LinkedIn in Buffer for 14:00 UTC, and commits
# data/social/log.json so a day is never posted twice. GitHub often starts scheduled runs hours late,
# so it is tried several times in the morning: the first run that starts does the work, later runs
# only re-check Buffer's health. Each run also opens a GitHub issue when Buffer reports a
# disconnected channel or a failed post (see the health check in scripts/post-daily.mjs).
on:
  schedule:
    - cron: '7 2 * * *'
    - cron: '7 6 * * *'
    - cron: '7 10 * * *'
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run prints the posts only; soon schedules them 15 minutes from now'
        type: choice
        options: [normal, dry-run, soon]
        default: normal

permissions:
  contents: write
  issues: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schedule today's post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            dry-run) node scripts/post-daily.mjs --dry-run ;;
            soon) node scripts/post-daily.mjs --soon ;;
            *) node scripts/post-daily.mjs ;;
          esac
      - name: Open an issue if Buffer needs attention
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=data/social/alert.md
          [ -f "$f" ] || exit 0
          printf '\n@JthP-JohnnyBlu-Eyes\n' >> "$f"
          title="Buffer needs attention"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file "$f"; else gh issue create --title "$title" --body-file "$f"; fi
          rm "$f"
      - name: Record what was posted
        if: always()
        run: |
          git add data/social 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="jobexposureindex-bot" -c user.email="actions@users.noreply.github.com" commit -m "Record daily social post"
          git pull --rebase -q && git push
