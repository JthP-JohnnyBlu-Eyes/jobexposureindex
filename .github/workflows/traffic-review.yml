name: Weekly traffic review

# Every Monday at 07:00 UTC: reads last week's Cloudflare Web Analytics (bots left out) for every
# site in the account and opens a GitHub issue labelled "traffic-review" with the numbers.
# GitHub emails you about the new issue. Needs the CLOUDFLARE_API_TOKEN repository secret.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days to review'
        default: '7'
      mode:
        description: 'issue opens a GitHub issue; dry-run only shows the review on the run page'
        type: choice
        options: [issue, dry-run]
        default: issue

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write the review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            node scripts/traffic-review.mjs --days "$DAYS" --dry-run
          else
            node scripts/traffic-review.mjs --days "$DAYS"
          fi
