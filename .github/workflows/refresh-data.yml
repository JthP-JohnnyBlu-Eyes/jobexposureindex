name: Refresh data

# Every Monday: downloads the latest BLS job numbers and Anthropic Economic Index usage data,
# rebuilds the index pages, and commits when anything changed. Cloudflare deploys the push.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-sources.sh', 'scripts/process-aei.py', 'scripts/build-index.mjs', '.github/workflows/refresh-data.yml']

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas openpyxl
      - run: scripts/fetch-sources.sh
      - run: python3 scripts/process-aei.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-index.mjs
      - name: Commit if changed
        run: |
          git add -A data public
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="jobexposureindex-bot" -c user.email="actions@users.noreply.github.com" commit -m "Refresh source data and rebuild the index"
          git push
