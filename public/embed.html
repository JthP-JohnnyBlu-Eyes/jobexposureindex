<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI exposure checker · Job Exposure Index</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://jobexposureindex.com/widget">
<style>
/* The widget other sites embed with an iframe (see /widget). ?job=<slug> shows one job; without it, a job lookup. */
:root { --bg: #FFFDF8; --line: #DED9CF; --ink: #14171C; --soft: #3A3F47; --muted: #65645E; --tile: #EDE8DE;
  --low: #3FA796; --moderate: #9DB15A; --mid: #E3B341; --high: #E8743B; --max: #D9473A; --accent: #D9473A;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: var(--sans); color: var(--ink); font-size: 15px; line-height: 1.45; }
.w { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 12px; max-width: 520px; }
.hd { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
label { display: block; font-weight: 600; margin: 0 0 6px; }
input { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid #C9C2B3; border-radius: 10px; background: #fff; color: var(--ink); }
input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul.sug { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: #fff; max-height: 168px; overflow: auto; }
ul.sug:empty { display: none; }
ul.sug li { padding: 7px 12px; cursor: pointer; }
ul.sug li[aria-selected="true"], ul.sug li:hover { background: var(--tile); }
.res { margin-top: 12px; }
.res[hidden] { display: none; }
.job { font-weight: 700; font-size: 17px; margin: 0; }
.row { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 6px; flex-wrap: wrap; }
.big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.big small { font-size: 15px; font-weight: 600; color: var(--muted); }
.pill { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--c); color: #fff; }
.band-low { --c: var(--low); } .band-moderate { --c: #7E9440; } .band-elevated { --c: #B8871A; } .band-high { --c: #D2602A; } .band-very-high { --c: var(--max); }
.bar { height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--low), var(--moderate), var(--mid), var(--high), var(--max)); position: relative; margin: 8px 0 4px; }
.bar i { position: absolute; top: -4px; width: 4px; height: 16px; margin-left: -2px; background: var(--ink); border-radius: 2px; }
.meta { color: var(--soft); font-size: 14px; margin: 0; }
.more { display: inline-block; margin-top: 6px; font-weight: 600; color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
.ft { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ft a { color: var(--muted); }
.err { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="w">
  <p class="hd">How exposed is this job to AI?</p>
  <div id="find" hidden>
    <label for="q">Type a job title</label>
    <input id="q" type="search" placeholder="e.g. accountant, nurse, truck driver" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sug" aria-autocomplete="list">
    <ul class="sug" id="sug" role="listbox" aria-label="Matching jobs"></ul>
  </div>
  <div class="res" id="res" hidden aria-live="polite">
    <p class="job" id="title"></p>
    <div class="row"><span class="big" id="score"></span><span class="pill" id="pill"></span></div>
    <div class="bar" aria-hidden="true"><i id="pin"></i></div>
    <p class="meta" id="meta"></p>
    <a class="more" id="more" target="_blank" rel="noopener">See which tasks AI can and can't do</a>
  </div>
  <p class="err" id="err" hidden>The scores couldn't load. <a href="https://jobexposureindex.com/jobs/" target="_blank" rel="noopener">Open the index</a>.</p>
  <div class="ft"><span>Scores from 0 (low) to 100 (high exposure)</span><a href="https://jobexposureindex.com/?utm_source=embed&amp;utm_medium=widget" target="_blank" rel="noopener">Job Exposure Index</a></div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var want = (params.get('job') || '').toLowerCase();
  var LABEL = { 'low': 'Low', 'moderate': 'Moderate', 'elevated': 'Elevated', 'high': 'High', 'very-high': 'Very high' };
  var $ = function (id) { return document.getElementById(id); };
  var jobs = [];

  function show(j) {
    var rank = jobs.indexOf(j) + 1;
    $('title').textContent = j.t;
    $('score').innerHTML = j.x + '<small> / 100</small>';
    $('pill').textContent = LABEL[j.b] + ' exposure';
    $('pill').className = 'pill band-' + j.b;
    $('pin').style.left = j.x + '%';
    $('meta').textContent = 'Ranked #' + (j.r || rank) + ' of ' + jobs.length + ' US jobs, where #1 is the most exposed.';
    $('more').href = 'https://jobexposureindex.com/jobs/' + j.s + '?utm_source=embed&utm_medium=widget';
    $('res').hidden = false;
    resize();
  }

  // Tell the page around the iframe how tall the widget is, for sites that listen (optional).
  function resize() {
    try { parent.postMessage({ jeiEmbedHeight: document.documentElement.scrollHeight }, '*'); } catch (e) {}
  }

  function lookup() {
    var q = $('q'), sug = $('sug'), active = -1, matches = [];
    function render() {
      sug.innerHTML = '';
      matches.forEach(function (j, i) {
        var li = document.createElement('li');
        li.textContent = j.t; li.id = 'o' + i; li.setAttribute('role', 'option');
        li.setAttribute('aria-selected', i === active ? 'true' : 'false');
        li.addEventListener('mousedown', function (e) { e.preventDefault(); choose(j); });
        sug.appendChild(li);
      });
      q.setAttribute('aria-expanded', matches.length ? 'true' : 'false');
      q.setAttribute('aria-activedescendant', active >= 0 ? 'o' + active : '');
      resize();
    }
    function choose(j) { q.value = j.t; matches = []; active = -1; render(); show(j); }
    q.addEventListener('input', function () {
      var v = q.value.trim().toLowerCase();
      active = -1;
      if (v.length < 2) { matches = []; render(); return; }
      var starts = [], has = [];
      jobs.forEach(function (j) { var t = j.t.toLowerCase(); if (t.indexOf(v) === 0) starts.push(j); else if (t.indexOf(v) > 0) has.push(j); });
      matches = starts.concat(has).slice(0, 8);
      render();
    });
    q.addEventListener('keydown', function (e) {
      if (!matches.length) return;
      if (e.key === 'ArrowDown') { active = (active + 1) % matches.length; render(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { active = (active - 1 + matches.length) % matches.length; render(); e.preventDefault(); }
      else if (e.key === 'Enter') { choose(matches[Math.max(active, 0)]); e.preventDefault(); }
      else if (e.key === 'Escape') { matches = []; render(); }
    });
    $('find').hidden = false;
  }

  fetch('/data/jobs.json').then(function (r) { if (!r.ok) throw r; return r.json(); }).then(function (data) {
    jobs = data;
    var j = want && jobs.filter(function (x) { return x.s === want; })[0];
    if (j) show(j); else lookup();
    resize();
  }).catch(function () { $('err').hidden = false; resize(); });
})();
</script>
</body>
</html>
